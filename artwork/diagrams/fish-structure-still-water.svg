<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#436d74"/></marker><g id="fish"><path d="M-16 0 Q0 -12 17 0 Q0 12 -16 0 L-24 -9 L-24 9 Z" fill="#294c43"/><circle cx="10" cy="-1" r="1.5" fill="#f5f6ed"/></g></defs><rect width="640" height="350" rx="14" fill="#e9f3f5"/><g font-family="sans-serif" fill="#233f44"><text x="22" y="30" font-size="20" font-weight="bold">Still water · look along edges and cover</text><text x="22" y="53" font-size="13">Top view · lake or sheltered pond</text><path d="M0 65 Q180 94 345 71 T640 83 V111 Q450 99 310 111 T0 100 Z" fill="#cec6aa"/><text x="260" y="94" font-size="14">Shore / shallows</text><path d="M35 105 Q40 140 29 174 M57 106 Q68 152 59 196 M80 106 Q73 150 84 174 M103 107 Q119 149 101 190 M124 107 Q137 141 130 168" fill="none" stroke="#7c9973" stroke-width="9"/><text x="23" y="224" font-size="15">Weed edge</text><path d="M400 99 L455 173 M433 139 L471 134 M420 124 L394 139" stroke="#897356" stroke-width="13" stroke-linecap="round"/><text x="470" y="174" font-size="14">Fallen timber</text><use href="#fish" transform="translate(153 177) rotate(-28)"/><use href="#fish" transform="translate(394 177) rotate(130)"/><path d="M20 256 Q170 285 315 248 T620 255" fill="none" stroke="#6b929d" stroke-width="2" stroke-dasharray="7 5"/><text x="28" y="313" font-size="15">Deeper water below this depth-change edge</text><use href="#fish" transform="translate(296 270) rotate(-15)"/><text x="225" y="204" font-size="14">Fish patrol edges,</text><text x="225" y="223" font-size="14">shade and nearby cover</text><text x="22" y="337" font-size="12">Fish move with food, light and depth. Symbols show places to look, not scale.</text></g></svg>
