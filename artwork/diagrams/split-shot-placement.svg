<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390"><rect width="640" height="390" rx="14" fill="#f4f6f3"/><g font-family="sans-serif" fill="#263e36" font-size="17"><text x="22" y="30" font-weight="bold">Where split shot goes · simple fixed-float rig</text><text x="22" y="65">Rod → line → float → weights → baited hook</text><path d="M35 95 Q90 80 145 119 L210 139" stroke="#263e36" fill="none" stroke-width="2"/><text x="24" y="100">Rod tip</text><path d="M25 150 H610" stroke="#859e91" stroke-width="2" stroke-dasharray="8 5"/><text x="430" y="141">Water surface</text><path d="M210 110 V316" stroke="#263e36" stroke-width="2"/><ellipse cx="210" cy="150" rx="11" ry="23" fill="#b4c2ba" stroke="#263e36" stroke-width="2"/><text x="248" y="160">Float: tip stays visible</text><circle cx="210" cy="216" r="6" fill="#263e36"/><circle cx="210" cy="245" r="6" fill="#263e36"/><text x="248" y="224">Split shot pinches onto the line</text><path d="M229 252 H238 V307 H229" fill="none" stroke="#263e36"/><text x="252" y="278">About 20 cm or more to start</text><text x="252" y="299" font-size="15">Lowest shot → hook; adjust as needed</text><path d="M210 316 V330 Q210 344 199 344 Q188 344 188 328 L188 321" fill="none" stroke="#263e36" stroke-width="3"/><path d="M185 331 Q175 325 182 316 M190 335 Q179 340 176 332" fill="none" stroke="#718d71" stroke-width="3"/><text x="248" y="339">Weed bait is ON the hook</text><text x="22" y="376" font-size="14">Not to scale. Some rigs add a swivel and leader; these are omitted here.</text></g></svg>
