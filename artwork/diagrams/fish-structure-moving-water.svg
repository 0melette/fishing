<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#436d74"/></marker><g id="fish"><path d="M-16 0 Q0 -12 17 0 Q0 12 -16 0 L-24 -9 L-24 9 Z" fill="#294c43"/><circle cx="10" cy="-1" r="1.5" fill="#f5f6ed"/></g></defs><rect width="640" height="350" rx="14" fill="#e9f3f5"/><g font-family="sans-serif" fill="#233f44"><text x="22" y="30" font-size="20" font-weight="bold">Moving water · shelter beside a food lane</text><text x="22" y="53" font-size="13">Top view · flow is left → right in this example</text><path d="M30 94 H598 M30 125 H598 M30 280 H598" stroke="#436d74" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="35" y="84" font-size="14">Main current carries food →</text><path d="M32 184 Q140 187 182 145 Q225 109 284 145 Q353 175 598 166 M32 226 Q141 226 182 258 Q225 291 284 253 Q353 219 598 230" fill="none" stroke="#7c9da6" stroke-width="2" marker-end="url(#arrow)"/><ellipse cx="223" cy="202" rx="37" ry="39" fill="#a9b2ab" stroke="#5e736d" stroke-width="2"/><text x="202" y="206" font-size="14">Rock</text><path d="M270 184 Q392 171 600 166" stroke="#897356" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="398" y="150" font-size="14">Current seam / feeding lane</text><ellipse cx="339" cy="209" rx="72" ry="25" fill="#d6e7df"/><use href="#fish" transform="translate(326 208) rotate(180)"/><use href="#fish" transform="translate(447 186) rotate(180)"/><text x="295" y="257" font-size="14">Slower pocket behind rock</text><text x="24" y="312" font-size="14">Fish can face into the flow and feed beside faster water.</text><text x="24" y="335" font-size="12">In a tidal estuary, recheck which side is downstream when the flow reverses.</text></g></svg>
